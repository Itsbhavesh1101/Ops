name: Full Verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows-flowable-config:
    name: Windows Flowable Configuration Regression
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Flowable settings with Windows USERNAME present
        run: python -m pytest tests/unit/workflow/test_flowable_config.py -q --tb=short

  linux-full-verification:
    name: Linux Complete Verification Manifest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: operations_engine
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E7_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/operations_engine
      E7_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      E7_JWT_SECRET_KEY: test_jwt_secret_key_for_ci_minimum_32_chars_long
      FLOWABLE_BASE_URL: http://localhost:8080/flowable-rest/service
      FLOWABLE_USER: rest-admin
      FLOWABLE_USERNAME: rest-admin
      FLOWABLE_PASSWORD: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare environment configuration
        run: |
          cp .env.example .env
          sed -i 's/55432/5432/g' .env
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/operations-ui/package-lock.json
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          npm --prefix ui/operations-ui ci
          npx --prefix ui/operations-ui playwright install --with-deps chromium
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.1
          cache: true
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Start Flowable
        run: |
          POSTGRES_CONTAINER=$(docker ps -q --filter "ancestor=postgres:16-alpine")
          docker rename "$POSTGRES_CONTAINER" e7-postgres-full || true
          docker exec e7-postgres-full psql -U postgres -c "CREATE DATABASE flowable_db;" || true
          NETWORK_ID=$(docker inspect e7-postgres-full --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker run -d --name e7-flowable-full --network "$NETWORK_ID" -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="jdbc:postgresql://postgres:5432/flowable_db" \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            -e SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver \
            flowable/flowable-rest:7.0.0
          for i in {1..40}; do
            if curl -fsS -u rest-admin:test http://localhost:8080/flowable-rest/service/repository/deployments >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs e7-flowable-full
          exit 1
      - name: Run complete verification manifest
        run: >-
          python scripts/verification/run_verification.py
          --group static
          --group backend
          --group frontend
          --group browser
          --group recovery
          --group uat
          --group security
          --group release
          --output dist/verification/full-verification.json
      - name: Upload full verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-verification-evidence
          path: dist/verification/full-verification.json
      - name: Stop Flowable
        if: always()
        run: docker rm -f e7-flowable-full || true
