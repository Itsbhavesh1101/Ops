name: CI

on:
  push:
  pull_request:

jobs:
  foundation-checks:
    name: Phase-1 Foundation & CI Baseline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: operations_engine
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E7_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/operations_engine
      E7_JWT_SECRET_KEY: test_jwt_secret_key_for_ci_minimum_32_chars_long

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare environment configuration
        run: |
          cp .env.example .env
          sed -i 's/55432/5432/g' .env

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile python source files
        run: |
          python -m compileall app

      - name: Run Ruff (linter & format checks)
        run: |
          ruff check .

      - name: Run Mypy (type check)
        run: |
          mypy app

      - name: Verify Global Pytest Collection (all 2,357 tests)
        run: |
          pytest --collect-only -q

      - name: Apply Database Migrations (disposable test postgres)
        run: |
          alembic upgrade head

      - name: Run Pytest (unit & contract test suites)
        run: |
          pytest tests/unit/ tests/contract/ -q --tb=short

      - name: Run Task Intelligence PostgreSQL Integration Tests
        env:
          E7_RUN_TASK_INTELLIGENCE_INTEGRATION: "1"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          PYTHONPATH: "."
        run: |
          pytest tests/integration/task_intelligence/ -v --tb=short

      - name: Run Durable Architecture PostgreSQL Integration Tests
        env:
          E7_RUN_POSTGRES_INTEGRATION: "1"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          PYTHONPATH: "."
        run: |
          pytest tests/integration/postgres/test_durable_integration_postgres.py -v --tb=short

      - name: Start Disposable RabbitMQ Container
        run: |
          docker run -d --name e7-rabbitmq -p 5672:5672 -p 15672:15672 rabbitmq:3.13-management-alpine
          for i in $(seq 1 30); do
            if docker exec e7-rabbitmq rabbitmq-diagnostics -q ping; then
              echo "RabbitMQ is ready"
              break
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          docker exec e7-rabbitmq rabbitmq-diagnostics -q ping

      - name: Run RabbitMQ Live Integration Tests
        env:
          E7_RUN_RABBITMQ_INTEGRATION: "1"
          RABBITMQ_HOST: "localhost"
          RABBITMQ_PORT: "5672"
          RABBITMQ_DEFAULT_USER: "guest"
          RABBITMQ_DEFAULT_PASS: "guest"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          PYTHONPATH: "."
        run: |
          pytest tests/integration/rabbitmq/ -v --tb=short

      - name: Stop Disposable RabbitMQ Container
        if: always()
        run: |
          docker rm -f e7-rabbitmq || true

  frontend-quality-gates:
    name: Frontend Quality Gates & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/operations-ui/package-lock.json"

      - name: Install UI dependencies
        run: |
          npm --prefix ui/operations-ui ci

      - name: Run ESLint
        run: |
          npm --prefix ui/operations-ui run lint

      - name: Run TypeScript typecheck
        run: |
          npm --prefix ui/operations-ui run typecheck

      - name: Run Vitest unit & integration tests
        run: |
          npm --prefix ui/operations-ui run test

      - name: Run Vite production build
        run: |
          npm --prefix ui/operations-ui run build


