name: CI

on:
  push:
  pull_request:

jobs:
  foundation-checks:
    name: Phase-1 Foundation & CI Baseline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: operations_engine
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E7_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/operations_engine
      E7_JWT_SECRET_KEY: test_jwt_secret_key_for_ci_minimum_32_chars_long

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare environment configuration
        run: |
          cp .env.example .env
          sed -i 's/55432/5432/g' .env

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile python source files
        run: |
          python -m compileall app

      - name: Run Ruff (linter & format checks)
        run: |
          ruff check .

      - name: Run Mypy (type check)
        run: |
          mypy app

      - name: Verify OpenAPI Contract Drift
        run: |
          python scripts/export_openapi.py --check

      - name: Verify Global Pytest Collection (all 2,391 tests)
        run: |
          pytest --collect-only -q

      - name: Apply Database Migrations (disposable test postgres)
        run: |
          alembic upgrade head

      - name: Run Pytest (unit, contract & security test suites)
        run: |
          pytest tests/unit/ tests/contract/ tests/security/ -q --tb=short

      - name: Run Task Intelligence PostgreSQL Integration Tests
        env:
          E7_RUN_TASK_INTELLIGENCE_INTEGRATION: "1"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          PYTHONPATH: "."
        run: |
          pytest tests/integration/task_intelligence/ -v --tb=short

      - name: Run Durable Architecture PostgreSQL Integration Tests
        env:
          E7_RUN_POSTGRES_INTEGRATION: "1"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          PYTHONPATH: "."
        run: |
          pytest tests/integration/postgres/test_durable_integration_postgres.py -v --tb=short

      - name: Ensure RabbitMQ Container Aliased as e7-rabbitmq
        run: |
          RABBIT_CONTAINER=$(docker ps -q --filter "ancestor=rabbitmq:3.13-management")
          echo "RabbitMQ service container ID: $RABBIT_CONTAINER"
          docker rename "$RABBIT_CONTAINER" e7-rabbitmq || true
          docker exec e7-rabbitmq rabbitmqctl status

      - name: Run RabbitMQ Live Integration Tests
        env:
          E7_RUN_RABBITMQ_INTEGRATION: "1"
          RABBITMQ_HOST: "localhost"
          RABBITMQ_PORT: "5672"
          RABBITMQ_DEFAULT_USER: "guest"
          RABBITMQ_DEFAULT_PASS: "guest"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          PYTHONPATH: "."
        run: |
          pytest tests/integration/rabbitmq/ -v --tb=short

      - name: Inspect RabbitMQ Broker Logs
        if: always()
        run: |
          docker logs e7-rabbitmq || true

      - name: Initialize Flowable Database & Start Engine
        run: |
          POSTGRES_CONTAINER=$(docker ps -q --filter "ancestor=postgres:16-alpine")
          echo "PostgreSQL service container ID: $POSTGRES_CONTAINER"
          docker rename "$POSTGRES_CONTAINER" e7-postgres || true
          docker exec e7-postgres psql -U postgres -c "CREATE DATABASE flowable_db;" || true
          NETWORK_ID=$(docker inspect e7-postgres --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          echo "Connecting Flowable to Docker network: $NETWORK_ID"
          docker run -d --name e7-flowable --network "$NETWORK_ID" -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="jdbc:postgresql://postgres:5432/flowable_db" \
            -e SPRING_DATASOURCE_USERNAME="postgres" \
            -e SPRING_DATASOURCE_PASSWORD="postgres" \
            -e SPRING_DATASOURCE_DRIVER_CLASS_NAME="org.postgresql.Driver" \
            flowable/flowable-rest:7.0.0
          echo "Waiting for Flowable REST API to be ready..."
          for i in {1..40}; do
            if curl -s -u rest-admin:test http://localhost:8080/flowable-rest/service/repository/deployments | grep -q "data"; then
              echo "Flowable is ready!"
              break
            fi
            echo "Waiting for Flowable ($i)..."
            sleep 3
          done
          curl -s -u rest-admin:test http://localhost:8080/flowable-rest/service/repository/deployments

      - name: Run Flowable Live Integration Tests
        env:
          E7_RUN_WORKFLOW_INTEGRATION: "1"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          FLOWABLE_BASE_URL: "http://localhost:8080/flowable-rest/service"
          FLOWABLE_USER: "rest-admin"
          FLOWABLE_PASSWORD: "test"
          PYTHONPATH: "."
        run: |
          pytest tests/integration/workflow/test_flowable_live.py -v --tb=short

      - name: Run Full-System Live Phase 6 E2E Integration Test
        env:
          E7_RUN_PHASE6_E2E: "1"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          E7_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/operations_engine"
          FLOWABLE_BASE_URL: "http://localhost:8080/flowable-rest/service"
          FLOWABLE_USER: "rest-admin"
          FLOWABLE_PASSWORD: "test"
          RABBITMQ_HOST: "localhost"
          RABBITMQ_PORT: "5672"
          E7_RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
          PYTHONPATH: "."
        run: |
          pytest tests/e2e/phase6/test_semester_exam_e2e.py -v --tb=short

      - name: Run Phase 7 Live Vertical Slice Integration Test
        env:
          E7_RUN_PHASE7_E2E: "1"
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "localhost"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          E7_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/operations_engine"
          PYTHONPATH: "."
        run: |
          pytest tests/e2e/phase7/test_phase7_live_vertical_slice.py -v --tb=short

      - name: Run Scheduling & Planning Performance Benchmarks
        run: |
          pytest tests/performance/test_scheduler_solver_load.py -k test_academic_scheduler_dataset_benchmarks -v
          pytest tests/performance/test_plan_generation_load.py -k test_context_builder_performance -v

      - name: Inspect Flowable Engine Logs
        if: always()
        run: |
          docker logs e7-flowable || true

  frontend-quality-gates:
    name: Frontend Quality Gates & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/operations-ui/package-lock.json"

      - name: Install UI dependencies
        run: |
          npm --prefix ui/operations-ui ci

      - name: Run ESLint
        run: |
          npm --prefix ui/operations-ui run lint

      - name: Run TypeScript typecheck
        run: |
          npm --prefix ui/operations-ui run typecheck

      - name: Run Vitest unit & integration tests
        run: |
          npm --prefix ui/operations-ui run test

      - name: Run Vite production build
        run: |
          npm --prefix ui/operations-ui run build


