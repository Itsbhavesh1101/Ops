name: CI

on:
  push:
  pull_request:

jobs:
  foundation-checks:
    name: Phase-1 Foundation & CI Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile python source files
        run: |
          python -m compileall app

      - name: Run Ruff (linter & format checks)
        run: |
          ruff check .

      - name: Run Mypy (type check)
        run: |
          mypy app

      - name: Run Pytest (unit & smoke tests)
        run: |
          pytest -q
