# Prometheus configuration for local observability runtime
# Part of Task 1K.6 (Phase 1 Observability)
# Scrapes metrics strictly from the OpenTelemetry Collector endpoint

global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
