services:
  # ----------------------------------------------------------------------------
  # E-7 Pilot Gateway (Layer-7 Reverse Proxy & Ingress Rate Limiter)
  # External boundary in front of frozen E-7 RC container.
  # Binds strictly to loopback (127.0.0.1) for local pilot verification.
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    container_name: e7-pilot-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PILOT_GATEWAY_PORT:-8088}:80"
    volumes:
      - ./docker/pilot-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # E-7 API: Consumes frozen Phase-8 Release Candidate image directly.
  # Zero rebuild; host port published bindings reset in pilot overlay.
  # Inbound traffic enters exclusively via the gateway proxy.
  # ----------------------------------------------------------------------------
  api:
    image: e7-operations-engine:demo-current
    build: !reset null
    ports: !reset []
    expose:
      - "8000"
    environment:
      E7_MOUNT_DOMAIN_ROUTERS: "true"
      E7_CORS_ALLOWED_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
      E7_GOOGLE_OIDC_CLIENT_IDS: '["e7-pilot-client-id"]'
      FLOWABLE_TIMEOUT_SECONDS: "10.0"
      FLOWABLE_MAX_RETRIES: "3"
      FLOWABLE_USERNAME: "rest-admin"
      FLOWABLE_PASSWORD: "test"

  # ----------------------------------------------------------------------------
  # E-7 Workers: Consume demo-current image consistently
  # ----------------------------------------------------------------------------
  worker:
    image: e7-operations-engine:demo-current
    build: !reset null

  scheduler-worker:
    image: e7-operations-engine:demo-current
    build: !reset null

  # ----------------------------------------------------------------------------
  # PostgreSQL: Strictly internal only in pilot topology
  # ----------------------------------------------------------------------------
  postgres:
    ports: !reset []
    expose:
      - "5432"
